name: Matcha stock check

on:
  schedule:
    # Every hour, at minute 17 (off-peak minute: GitHub delays runs
    # scheduled at :00 the most). Costs ~1 min/run, ~720 min/month,
    # well within the free 2000 min/month for private repos.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "TEST: send a fake alert to verify push + email delivery"
        type: boolean
        default: false
      canary:
        description: "CANARY: real check, alert on ANY size (incl. 30g) to test live detection"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check stock (push via ntfy + email via your mailbox)
        env:
          FORCE_TEST: ${{ inputs.test == true && '1' || '0' }}
          FORCE_CANARY: ${{ inputs.canary == true && '1' || '0' }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
        run: python check_stock.py
        # The run only goes red if the alert email could NOT be sent
        # (then GitHub's own failure email acts as backup).
