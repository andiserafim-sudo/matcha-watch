      - name: Keep the last 24 hours of runs
        if: always()
        run: |
          python - <<'PY'
          import os, re, datetime

          new = open("last-run.log", encoding="utf-8").read()
          old = ""
          if os.path.exists("runs-recent.log"):
              old = open("runs-recent.log", encoding="utf-8").read()

          # blocks start with "run #", newest first
          blocks = [b for b in (new + "\n" + old).split("run #") if b.strip()]
          now = datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          cutoff = now - datetime.timedelta(hours=24)

          keep = []
          for i, b in enumerate(blocks):
              m = re.match(r"\s*\d+ \| (\d{4}-\d{2}-\d{2} \d{2}:\d{2}) UTC", b)
              if not m:
                  continue                      # unparseable header, drop it
              when = datetime.datetime.strptime(m.group(1), "%Y-%m-%d %H:%M")
              if when >= cutoff or i == 0:      # always keep the newest run
                  keep.append(b.rstrip())

          with open("runs-recent.log", "w", encoding="utf-8") as f:
              f.write("run #" + "\n\nrun #".join(keep) + "\n")
          print(f"kept {len(keep)} run(s) from the last 24 hours")
          PY
          rm -f last-run.log
