name: Matcha stock check

on:
  schedule:
    # Two offset schedules: GitHub silently drops many scheduled runs on
    # busy infrastructure, so asking twice per hour at unpopular minutes
    # gets us closer to an actual hourly cadence.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "TEST: send a fake alert to verify push + email delivery"
        type: boolean
        default: false
      canary:
        description: "CANARY: real check, alert on ANY size, ignores the no-repeat memory"
        type: boolean
        default: false

permissions:
  contents: write     # needed to save state.json (the no-repeat memory)

concurrency:
  group: matcha-stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Check stock (push via ntfy + email via your mailbox)
        id: stock
        continue-on-error: true
        env:
          FORCE_TEST: ${{ inputs.test == true && '1' || '0' }}
          FORCE_CANARY: ${{ inputs.canary == true && '1' || '0' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
        run: python check_stock.py

      - name: Save the no-repeat memory
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "matcha-watch"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "update stock state [skip ci]"
            git pull --rebase --autostash || true
            git push
          else
            echo "No state change, nothing to commit."
          fi

      - name: Propagate result
        if: steps.stock.outcome == 'failure'
        run: |
          echo "Alert email could not be sent, failing so GitHub notifies as backup."
          exit 1
