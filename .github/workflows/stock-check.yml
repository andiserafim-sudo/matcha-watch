name: Matcha stock check

on:
  schedule:
    # Times are UTC. 00:30 UTC = 09:30 JST, 06:30 UTC = 15:30 JST
    - cron: "30 0 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "TEST: send a fake alert to verify push + email delivery"
        type: boolean
        default: false
      canary:
        description: "CANARY: real check, alert on ANY size (incl. 30g) to test live detection"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Check stock (sends ntfy push directly)
        id: stock
        continue-on-error: true
        env:
          FORCE_TEST: ${{ inputs.test == true && '1' || '0' }}
          FORCE_CANARY: ${{ inputs.canary == true && '1' || '0' }}
        run: python check_stock.py

      - name: Email alert via GitHub issue (contains buy links)
        if: steps.stock.outputs.in_stock == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: ${{ toJSON(steps.stock.outputs.subject) }},
              body: ${{ toJSON(steps.stock.outputs.details) }}
            });

      - name: Mark run red (backup GitHub email)
        if: steps.stock.outputs.in_stock == 'true'
        run: |
          echo "IN STOCK - push sent, issue created. Failing on purpose for the backup email."
          exit 1
